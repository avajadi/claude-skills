# Build and unit tests on every push to main and on pull requests.
#
# Linux only, because it's the cheapest runner: in a private repo, Windows minutes count double and macOS minutes ten
# times against the free quota. The release workflows build, validate and package all three platforms. In a public
# repo all runners are free, so you could add Windows and macOS here too.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "packaging/**", ".github/workflows/release*.yml"]
  pull_request:
    paths-ignore: ["**.md", "packaging/**", ".github/workflows/release*.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version string

      - name: Load plugin settings
        run: grep -vE '^[[:space:]]*(#|$)' packaging/plugin.env | tr -d '\r' >> "$GITHUB_ENV"

      # The libraries JUCE needs on Linux.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl-dev libegl-dev

      # Sources fetched by FetchContent (JUCE and the rest), keyed on the CMake files that pin their versions.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake --preset debug $CMAKE_EXTRA_ARGS
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        if: env.TEST_TARGET != ''
        run: ctest --preset debug
