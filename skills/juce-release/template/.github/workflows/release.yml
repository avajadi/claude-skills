# Pushing a tag vX.Y.Z (matching the version in CMakeLists.txt) builds, tests and validates the plug-in on Windows,
# macOS and Linux, then publishes the Windows installer and the Windows, macOS and Linux zips as a GitHub Release.
# Nothing is published unless every platform passes. To drop a platform, delete its job and its entry in `needs`.
#
# To build without releasing, run Release (Windows), (macOS) or (Linux) by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/release-windows.yml

  macos:
    uses: ./.github/workflows/release-macos.yml

  linux:
    uses: ./.github/workflows/release-linux.yml

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Load plugin settings
        run: grep -vE '^[[:space:]]*(#|$)' packaging/plugin.env | tr -d '\r' >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Release notes: this version's "## [x.y.z]" section of CHANGELOG.md, or GitHub's generated notes.
          if [[ -f CHANGELOG.md ]]; then
            awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          fi
          if [[ -s notes.md ]]; then
            gh release create "$tag" dist/* --title "$PRODUCT_NAME $version" --notes-file notes.md
          else
            gh release create "$tag" dist/* --title "$PRODUCT_NAME $version" --generate-notes
          fi
